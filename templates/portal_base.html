<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>{% block title %}Portal do cliente{% endblock %} · SocialMedia IA</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='approvals.css') }}"></head><body class="portal-body"><header class="portal-topbar"><a class="brand" href="{{ url_for('portal_approvals') }}"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M5 21.5 12.4 14l5.3 5.3L27 9.8"/><path d="M19.8 9.8H27v7.1"/><circle cx="7" cy="25" r="2"/></svg></span><span class="brand-copy">SocialMedia<span>IA</span><small>PORTAL DE CLIENTES</small></span></a><div class="portal-header-right"><span class="portal-agency-chip">{{ client['trade_name'] or client['company_name'] }}</span><div class="portal-person"><span class="portal-person-avatar">{{ portal_user['name'][0]|upper }}</span><span>{{ portal_user['name'] }}</span></div><form method="post" action="{{ url_for('portal_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="portal-logout">Sair ↗</button></form></div></header><main class="portal-content">{% block content %}{% endblock %}</main><footer class="portal-footer">Aprovações privadas · {{ client['company_name'] }} · SocialMedia IA</footer>{% block scripts %}{% endblock %}</body></html>
