name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python, JavaScript, and container entrypoint syntax
        run: |
          python -m py_compile app.py meta_integration.py installer.py tests/*.py
          node --check static/app.js
          node --check static/install.js
          sh -n docker-entrypoint.sh
          sh -n scripts/backup-data.sh

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test automatic installation from environment
        env:
          SOCIALMEDIA_AUTO_INSTALL: "1"
          SOCIALMEDIA_AGENCY_NAME: "CI Agency"
          SOCIALMEDIA_OWNER_NAME: "CI Owner"
          SOCIALMEDIA_OWNER_EMAIL: "ci-owner@example.com"
          SOCIALMEDIA_OWNER_PASSWORD: "CiAutomaticPass123"
          SOCIALMEDIA_PUBLIC_ORIGIN: "https://ci.example"
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          import sys

          data = Path(tempfile.mkdtemp())
          os.environ["SOCIALMEDIA_DATA"] = str(data)
          os.environ["SOCIALMEDIA_DB"] = str(data / "socialmedia.db")
          import app

          assert app.AUTO_INSTALL_STATUS == "installed", app.AUTO_INSTALL_STATUS
          client = app.app.test_client()
          health = client.get("/health").get_json()
          assert health["status"] == "ok"
          assert health["installation"]["automatic"] == "installed"
          assert health["installation"]["pending"] is False
          assert client.get("/install").status_code == 410
          assert client.get("/").headers["Location"] == "/login"
          assert oct((data / "installer.env").stat().st_mode)[-3:] == "600"
          print(json.dumps(health))
          PY

      - name: Build Docker image
        run: docker build --tag socialmedia-ia:ci .

      - name: Validate Docker Compose configuration
        run: |
          printf '%s\n' 'SECRET_KEY=ci-only-secret-not-for-production-0123456789abc' > "$RUNNER_TEMP/socialmedia.env"
          chmod 600 "$RUNNER_TEMP/socialmedia.env"
          SOCIALMEDIA_ENV_FILE="$RUNNER_TEMP/socialmedia.env" docker compose -f compose.yaml config --quiet

      - name: Smoke-test production container
        env:
          SECRET_KEY: ci-only-secret-not-for-production-0123456789abc
          COOKIE_SECURE: "1"
        run: |
          docker volume create socialmedia-ia-ci-data
          docker run --detach --name socialmedia-ia-ci \
            --publish 127.0.0.1:5051:5000 \
            --volume socialmedia-ia-ci-data:/data \
            --env SECRET_KEY --env COOKIE_SECURE \
            socialmedia-ia:ci
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          def check_runtime():
              deadline = time.monotonic() + 25
              last_error = None
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:5051/health", timeout=2) as response:
                          payload = json.loads(response.read())
                      if payload.get("status") != "ok" or payload.get("database") != "sqlite":
                          raise RuntimeError(f"Unexpected health response: {payload!r}")
                      subprocess.run([
                          "docker", "exec", "socialmedia-ia-ci", "python", "-c",
                          "import sqlite3; db=sqlite3.connect('/data/socialmedia.db'); assert db.execute(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='companies'\").fetchone(); db.close()",
                      ], check=True)
                      print("Container health and persistent SQLite volume passed.")
                      return
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      last_error = exc
                      time.sleep(0.5)
              subprocess.run(["docker", "logs", "socialmedia-ia-ci"], check=False)
              raise RuntimeError(f"Container did not become healthy: {last_error}")

          check_runtime()
          subprocess.run(["docker", "stop", "socialmedia-ia-ci"], check=True)
          subprocess.run(["docker", "start", "socialmedia-ia-ci"], check=True)
          check_runtime()
          PY

      - name: Clean up smoke-test container and volume
        if: always()
        run: |
          docker rm --force socialmedia-ia-ci || true
          docker volume rm socialmedia-ia-ci-data || true
