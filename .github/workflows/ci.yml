name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python, JavaScript, and container entrypoint syntax
        run: |
          python -m py_compile app.py meta_integration.py tests/*.py
          node --check static/app.js
          sh -n docker-entrypoint.sh

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build --tag socialmedia-ia:ci .

      - name: Validate Docker Compose configuration
        run: |
          printf '%s\n' 'SECRET_KEY=ci-only-secret-not-for-production-0123456789abc' > "$RUNNER_TEMP/socialmedia.env"
          chmod 600 "$RUNNER_TEMP/socialmedia.env"
          SOCIALMEDIA_ENV_FILE="$RUNNER_TEMP/socialmedia.env" docker compose -f compose.yaml config --quiet

      - name: Smoke-test production container
        env:
          SECRET_KEY: ci-only-secret-not-for-production-0123456789abc
          COOKIE_SECURE: "1"
        run: |
          docker run --detach --name socialmedia-ia-ci \
            --publish 127.0.0.1:5051:5000 \
            --tmpfs /data:rw,size=64m,uid=10001,gid=10001 \
            --env SECRET_KEY --env COOKIE_SECURE \
            socialmedia-ia:ci
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 25
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:5051/health", timeout=2) as response:
                      payload = json.loads(response.read())
                  if payload.get("status") != "ok" or payload.get("database") != "sqlite":
                      raise RuntimeError(f"Unexpected health response: {payload!r}")
                  print("Production container health check passed.")
                  break
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  last_error = exc
                  time.sleep(0.5)
          else:
              subprocess.run(["docker", "logs", "socialmedia-ia-ci"], check=False)
              raise RuntimeError(f"Container did not become healthy: {last_error}")
          PY

      - name: Clean up smoke-test container
        if: always()
        run: docker rm --force socialmedia-ia-ci || true
