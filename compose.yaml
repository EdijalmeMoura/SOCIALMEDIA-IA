services:
  web:
    build: .
    container_name: socialmedia-ia
    restart: unless-stopped
    env_file:
      # Optional: pre-provisioned secrets (SECRET_KEY, META_*, OPENAI_*).
      # Without it, the browser installer writes /data/installer.env instead.
      - path: ${SOCIALMEDIA_ENV_FILE:-/etc/socialmedia-ia/socialmedia.env}
        required: false
    environment:
      COOKIE_SECURE: "1"
      PORT: "5000"
      SOCIALMEDIA_DATA: /data
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - socialmedia_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  socialmedia_data:
    name: socialmedia-ia-data
